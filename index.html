<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Icon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/Icon512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!--
      `viewport-fit=cover` is what makes `env(safe-area-inset-*)` resolve to
      anything but 0. The PWA leans on those insets all over the phone layout
      (reader header, tab bar, floating buttons), and the status bar is set to
      `black-translucent`, so without it iOS lays the status bar over the header
      with nothing padding it clear, and the tab bar sits under the home
      indicator. Harmless in the Tauri build, which has no insets to report.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Minikyu</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="http://localhost:8097"></script>
  </body>
</html>
