pre-commit:
  parallel: true
  commands:
    fmt:
      glob: '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,yml,yaml,html}'
      run: bunx vp fmt {staged_files} --write
      stage_fixed: true

    lint:
      glob: '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
      run: bunx vp lint --fix {staged_files}
      stage_fixed: true

    type-check:
      glob: '**/*.{ts,tsx}'
      run: bunx tsc --noEmit

    i18n-compile:
      glob: '**/*.{ts,tsx}'
      run: bunx lingui extract && bunx lingui compile --typescript
      stage_fixed: true

    actionlint:
      glob: '.github/workflows/*.{yml,yaml}'
      run: actionlint -shellcheck=""

pre-push:
  parallel: true
  commands:
    lint-full:
      run: bun run lint

    test:
      run: bun run test:run

    tauri-check:
      run: bun run tauri:check

commit-msg:
  commands:
    lint:
      run: bunx commitlint --edit {1}
